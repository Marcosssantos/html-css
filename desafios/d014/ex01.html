<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            border-collapse: collapse;
        }
        caption {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
        } 
        th {
            background-color: #16121262;
        }  
        .area {
            background-color: #f2f2f2;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Exercicio de tabelas</h1>
    <table>
        <caption>
            Tabela de Notas dos Alunos:
        </caption>
        <thead>
            <tr>
                <th rowspan="2"  scope="col">Área</th>
                <th rowspan="2" scope="col">Diciplina</th>
                <th colspan="2" scope="colgroup">Notas</th>
                <th rowspan="2"  scope="colgroup">Média</th>
            </tr>
            <tr>
                <th scope="col">1º Bimestre</th>
                <th scope="col">2º Bimestre</th>
        </thead>
        <tbody>
            <tr>
                <td class="area" rowspan="3" scope="rowgroup">Exatas</td>
                <td>Ana Maria Santos</td>
                <td>00</td>
                <td>00</td>
                <td>00</td>
            </tr>
            <tr>
                <td>Beatriz sauza</td>
                <td>00</td>
                <td>00</td>
                <td>00</td>
            </tr>
            <tr>
                <td>Carla Dias</td>
                <td>00</td>
                <td>00</td>
                <td>00</td>
            </tr>
            <tr>
                <th colspan="4" scope="row">Média de  Exatas</th>
                <th>8.75</th>
            </tr>
            <tr>
                <th class="area" rowspan="3" scope="rowgroup">Humanas</th>
                <td>João Pedro Silva</td>
                <td>00</td>
                <td>00</td>
                <td>00</td>
            </tr>
            <tr>
                <td>Lucas Almeida</td>
                <td>00</td>
                <td>00</td>
                <td>00</td>
            </tr>
            <tr>
                <td>Rafael Costa</td>
                <td>00</td>
                <td>00</td>
                <td>00</td>
            </tr>
            <tr>
                <th colspan="4" scope="row">Média de  Humanas</th>
                <th>8.75</th>
            </tr>
        </tbody>
    </table>
</body>
</html>
