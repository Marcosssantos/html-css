<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
<style>
    body {
        font-family: Arial, Arial, Helvetica, sans-serif;
    }
    table {
        width: 400px;
        border-collapse: collapse;
       
    }
    tr.linha { 
        background-color: gray;
    }
    td {
        border: 1px solid #000;
        padding: 8px;
    }
    td.dado {
        background-color: yellow;
    }

</style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <!-- hierarquia de tabelas (simples)
      TABLE = tabela  
           TABLE ROW = linha da tabela 
                TABLE HEADER = cabeçalho da tabela
                     TABLE DATA = dados da tabela -->
                          
    <table>
        <tr> <!--linha da tabela -->
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr class="linha">
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr>
            <td>A4</td>
            <td class="dado">B4</td>
            <td>C4</td>
        </tr>
        <tr>
            <td>A5</td>
            <td>B5</td>
            <td>C5</td>
        </tr>
        <tr>
            <td>A6</td>
            <td>B6</td>
        </tr>
