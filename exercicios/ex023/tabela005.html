<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio de Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            width: 500px;
            border-collapse: collapse;
        }
        caption {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
        }   
        col.cnome {
            background-color: #d9db36;
            width: 200px;
        } 
        col.cgrupos {
            background-color: #b336d9;
            width: 100px;
        }
    </style>
</head>
<body>
    <h1>Exercicio de Tabelas</h1>

    <table>
     <colgroup>
         <col class="cnome">
         <col class="cgrupos" span ="3">
         <col class="csexo"> 
         <col class="cidade">
         <col class="cprofissao">
         
     </colgroup>
        <caption>Cadastro</caption>
        <thead>
            <tr>
                <th scope="col">Nome</th>
                <th scope="col">Sexo</th>
                <th scope="col">Idade</th>
                <th scope="col">Profissão</th>
            </tr>
            <tr>
                <td>Ana maria</td>
                <td>F</td>
                <td>25</td>
                <td>Engenharia</td>
            </tr>
            <tr>
                <td>João Pedro</td>
                <td>M</td>
                <td>30</td>
                <td>Medicina</td>
            </tr>
            <tr>    
                <td>Carla Dias</td>
                <td>F</td>
                <td>28</td>
                <td>Arquitetura</td>
            </tr>
        </thead>
        <tbody> 
    </table>
</body>
</html>
